[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "photobooth"
version = "0.2.1"
description = "Raspberry Pi photobooth controller for Capturing Time Photography"
readme = "README.md"
authors = [{ name = "Ian Price", email = "ian@capturingtimephoto.net" }]
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "ctp-utilities @ git+https://github.com/capturingtime/utilities.git@v0.2.1",
    "boto3>=1.26.0",
    "django>=3.2.3",
    "Pillow>=9.0.0",
    "python-escpos==2.2.0",
    "qrcode[pil]>=7.3.1",
]

[project.optional-dependencies]
# Hardware deps — not available on non-Pi systems; install only on the Pi
rpi = [
    "RPi.GPIO>=0.7.0",
    "Adafruit-Blinka>=6.5.0",
    "adafruit-circuitpython-neopixel>=6.0.3",
]
dev = [
    "black>=23.0.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.10.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["photobooth*", "photobooth_web*"]

[tool.black]
line-length = 88
target-version = ["py38", "py39", "py310", "py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--ignore=tests/cntdwn_np_test.py"
