{% load static %}
<!DOCTYPE html>
<html>
<head>
    <style>
        body { background-color: black; margin: 0; padding: 0; }
        .frame { position: relative; width: 100vw; height: 100vh; visibility: hidden; }
        .photo {
            position: absolute; width: 100%; height: 100%;
            object-fit: contain;
        }
        .overlay {
            position: absolute; width: 100%; height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>
  <div class="frame" id="frame">
    <img class="photo" id="photo">
    <img class="overlay" id="overlay" src="{% static "img/series_final.png" %}">
  </div>
  <script>
    var ph = document.getElementById('photo');
    var ov = document.getElementById('overlay');
    var fr = document.getElementById('frame');
    function reveal() { if (ph.complete && ov.complete) fr.style.visibility = 'visible'; }
    ph.onload = reveal;
    ov.onload = reveal;
    ph.src = "{% static 'img/last.jpg' %}?" + Date.now();
    if (ph.complete && ov.complete) reveal();
  </script>
</body>
</html>
